# =================================================================
# BỘ CẤU HÌNH TỐI ƯU FREE FIRE MAX PRO (AIM STABILIZER & OFFSET HUB)
# Thiết bị mục tiêu: Samsung Galaxy A16 (SM-A166P) / Mọi dòng máy Android - iOS
# Phiên bản: OB46 VIP ULTRA STABILIZER
# =================================================================

[1. AIM_HEAD_OFFSET_CALIBRATION]
# Tọa độ bù trục Y nâng tâm từ ngực thẳng vào đầu
TargetBone=Head
TargetBoneIndex=8
HeadOffset_Y=1.75
AimSnapSpeed=25.0
AimLockSensitivity=2.50
DynamicAimMagnet=1
MagnetPullForce=2.50
AutoAimHeadTrack=1

[2. ANTI_OVERSHOOT_BRAKE]
# Hãm lực vuốt khi tâm chạm đầu, triệt tiêu 100% hiện tượng vọt lố lên trời
AntiOvershootBrake=85%
BrakeThresholdDistance=35px
OvershootDecelerationFactor=0.15
MaxFlickHeightLimit=HeadLevel
AutoLockHeadOnFire=1
InstantStopAtHead=1

[3. ANTI_JITTER_CROSSHAIR_STABILIZER]
# Triệt tiêu rung lắc tâm súng, làm mịn góc nhìn vi điểm
CrosshairStability=1.00
KalmanFilterDamping=18.5
CrosshairJitterReduction=1.00
AimSlerpDamping=18.5
ZeroRecoilOnFire=1
WeaponsRecoil=0.00
VerticalRecoil=0.00
HorizontalRecoil=0.00
CameraShakeReduction=1.00
NoShakeCamera=1
AntiFlickerCrosshair=1

[4. SAMSUNG_GALAXY_A16_OPTIMAL_SENSITIVITY]
# Bộ thông số nhạy chuẩn cài đặt trong game Free Fire MAX
General_LookAround=100
RedDot_Sight=86
Scope_2X=82
Scope_4X=78
Sniper_Scope=50
Free_Look=65
FireButtonSize=44%
FireButtonPosition=BottomRight_Corner

[5. DEVICE_HARDWARE_TOUCH_BOOST]
# Tinh chỉnh phần cứng One UI trên Samsung
MinimumWidth_DPI=460
PointerSpeed=Maximum
MotionSmoothness=High_90Hz
TouchSensitivity=Enabled
TouchSamplingRate=360Hz
TouchResponseLatency=0ms

[6. BULLET_SPREAD_NO_BLOOM]
# Đạn đi thẳng tắp, không nở tâm khi sấy liên tục
StraightBulletPath=1
BulletSpread=0.00
NoBloomOnFire=1
FixedCrosshairSize=1
WeaponAccuracy=100
MagicBulletTrajectory=1

[7. GRAPHICS_FPS_UNLOCK]
# Cài đặt đồ họa tối ưu duy trì khung hình mượt nhất
DisplayQuality=Smooth
HighFPSMode=High
FrameRateLimit=144
TargetFPS=90_144
AntiLag=1
PingStabilizer=1
RAMCleaner=1
